name: medagent

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: medagent-platform:stage1
    environment:
      MEDAGENT_DB: /app/data/medagent.db
      # 生产必须由编排平台/密钥管理注入，不要写入镜像
      # LLM_MODE: live
      # LLM_BASE_URL: https://llm.example.com/v1
      # LLM_API_KEY: ${LLM_API_KEY}
      # ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
      # DIFY_BASE_URL: https://dify.example.com/v1
      # DIFY_API_KEY: ${DIFY_API_KEY}
    ports:
      - "8080:8000"
    volumes:
      - medagent-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 可选：TLS 反向代理（需先生成 deploy/nginx/tls/server.crt/key）
  # 启动：docker compose --profile proxy up -d
  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    restart: unless-stopped

  # 下一阶段 PostgreSQL 迁移演练位；当前应用仍用 SQLite，未接线，勿当生产存储
  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_DB: medagent
      POSTGRES_USER: medagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    volumes:
      - medagent-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medagent -d medagent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medagent-data:
  medagent-pg:
